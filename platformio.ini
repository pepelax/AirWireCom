; AirWireCom — единая прошивка для мастера и слейва
; Выбери нужный env перед прошивкой

[env]
framework     = arduino
lib_deps      = gyverlibs/EncButton
upload_speed  = 921600
monitor_speed = 115200

; ── ESP32-S2 Mini (рекомендуется для мастера — нативный USB) ──
[env:s2mini]
platform      = espressif32
board         = lolin_s2_mini
build_flags   =
    -Isrc
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
upload_port   = COM8
monitor_port  = COM8

[env:s2mini_debug]
platform      = espressif32
board         = lolin_s2_mini
build_flags   =
    -Isrc
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
    -DDEBUG
upload_port   = COM8
monitor_port  = COM8

; ── ESP32 (оригинальный, внешний CH340) ───────────────────────
[env:esp32]
platform      = espressif32
board         = esp32dev
upload_port   = COM6
monitor_port  = COM6

[env:esp32_debug]
platform      = espressif32
board         = esp32dev
build_flags   = -DDEBUG
upload_port   = COM6
monitor_port  = COM6

; ── ESP8266 ───────────────────────────────────────────────────
[env:esp8266]
platform      = espressif8266
board         = nodemcuv2
upload_port   = COM7
monitor_port  = COM7

[env:esp8266_debug]
platform      = espressif8266
board         = nodemcuv2
build_flags   = -DDEBUG
upload_port   = COM7
monitor_port  = COM7
