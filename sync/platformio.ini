; AirWireCom — единая прошивка для мастера и слейва
; Выбери нужный env перед прошивкой
 
; ── ESP32-S2 Mini (рекомендуется для мастера — нативный USB) ──
; [env:s2mini]
; platform     = espressif32
; board        = lolin_s2_mini
; framework    = arduino
; lib_deps     = gyverlibs/EncButton
; build_flags =
; 	-Isrc
; 	-DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"

; upload_speed  = 921600
; monitor_speed = 115200
; upload_port = COM6
; monitor_port = COM8
 
; ── ESP32 (оригинальный, внешний CH340) ───────────────────────
; [env:esp32]
; platform     = espressif32
; board        = esp32dev
; framework    = arduino
; upload_speed  = 921600
; monitor_speed = 115200
 
; ── ESP8266 ───────────────────────────────────────────────────
[env:esp8266]
platform     = espressif8266
board        = nodemcuv2
framework    = arduino
lib_deps     = gyverlibs/EncButton
upload_speed  = 921600
monitor_speed = 115200
upload_port = COM7
monitor_port = COM8
 
